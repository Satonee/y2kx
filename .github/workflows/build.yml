name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --workspace --release

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: y2kx-windows
          path: target/release/**/*.exe
          if-no-files-found: error
